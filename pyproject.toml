[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-ingestion"
version = "0.1.0"
description = "Bounded NASA IRSA SPHEREx discovery and cutout ingestion"
requires-python = ">=3.11"
dependencies = [
  "astropy>=6.1",
  "astroquery>=0.4.7",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyvo>=1.5",
  "reproject>=0.14",
  "requests>=2.32",
]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
